# Aria Support backend configuration

play.filters.enabled += "play.filters.cors.CORSFilter"

# Local dev (Angular on :4200) and the deployed GitHub Pages frontend.
# Override/extend by setting FRONTEND_ORIGIN in the environment.
play.filters.cors {
  allowedOrigins = ["http://localhost:4200", "https://zymith123.github.io"]
  allowedOrigins = ${?CORS_ALLOWED_ORIGINS_OVERRIDE}
  allowedHttpMethods = ["GET", "POST", "PATCH", "PUT", "OPTIONS"]
  supportsCredentials = false
}

# Disable CSRF for this read-only JSON API (no state-changing endpoints)
play.filters.disabled += "play.filters.csrf.CSRFFilter"

play.filters.hosts {
  allowed = ["."]
}

# Local Postgres defaults for `sbt run`; overridden in production by the
# JDBC_DATABASE_* env vars the Docker entrypoint derives from Render's
# injected DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD (see
# backend/docker-entrypoint.sh and backend/render.yaml).
db.default.driver = "org.postgresql.Driver"
db.default.url = "jdbc:postgresql://localhost:5432/aria_support"
db.default.url = ${?JDBC_DATABASE_URL}
db.default.username = "aria"
db.default.username = ${?JDBC_DATABASE_USERNAME}
db.default.password = "aria"
db.default.password = ${?JDBC_DATABASE_PASSWORD}

play.evolutions.db.default.enabled = true
play.evolutions.autoApply = true

# Required in Prod mode (256+ bits for HS256 JWT signing). Local/dev fallback
# below; render.yaml sets a real value via the APPLICATION_SECRET env var.
play.http.secret.key = "2fcb145bca3b1830342aecf764d034910b67f32d6f9561d95fe6dc4eb5e262a3"
play.http.secret.key = ${?APPLICATION_SECRET}
